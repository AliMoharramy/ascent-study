# seed/mock-exams.yaml
# منبع: جدول «برنامه زمانی ۱۳ مرحله آزمون آزمایشی cshub» (تصویر، خوانده‌شده در 22 آبان 1405)
# ⚠ ارقام از روی تصویر خوانده شده‌اند؛ در گام Import باید با تصویر اصلی دوباره تطبیق داده شوند.
# ⚠ بودجه‌بندی هر آزمون به تفکیک درس و فصل در ۱۳ تصویر جداگانه است و هنوز استخراج نشده (کار T-DATA-03).
# پس از تاریخ اصلی، آزمون‌ها «شناور» می‌شوند: هر زمان بخواهی شرکت می‌کنی، کارنامه روزانه صادر می‌شود،
# ولی اسم تو دیگر در لیدربورد اصلی نمی‌آید.
# کاربر ثبت‌نام کرده است. تصمیم کاربر: فعلاً آزمون نمی‌دهیم؛ در انتها همه را از اول می‌دهیم.

provider: cshub.ir
user_registered: true
user_policy: "defer_all_then_binge_late"   # آزمون‌ها به عقب رانده می‌شوند و در فاز Arena پشت‌سرهم داده می‌شوند


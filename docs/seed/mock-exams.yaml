# مجموع سؤال‌های زبان در آزمون‌های جامع (۹ به بعد) طبق تصویر: لغت 7 + گرامر 3 + درک مطلب 15 ≈ 25 (تقریبی)
# درس‌های جبر خطی در آزمون‌ها حضور دارند؛ چون کاربر جبر خطی را نمی‌خواند، این بخش‌ها در تحلیل کارنامه

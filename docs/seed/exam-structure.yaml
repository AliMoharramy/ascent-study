  boxes:
    - { name: "زبان عمومی و تخصصی", questions: 25 }
    - { name: "ریاضیات (ریاضی عمومی ۱و۲، آمار، گسسته)", questions: 20 }
    - { name: "تخصصی ۱: نظریه زبان‌ها + سیگنال", questions: 10 }
    - { name: "تخصصی ۲: ساختمان داده، طراحی الگوریتم، هوش", questions: 20 }
    - { name: "تخصصی ۳: مدار منطقی، معماری، الکترونیک دیجیتال", questions: 20 }
    - { name: "تخصصی ۴: سیستم‌عامل، شبکه، پایگاه داده", questions: 20 }
  total_questions: 115        # جمع ردیف‌ها (محاسبهٔ من)
  duration_min: 240           # ادعای cshub: «زمان کنکور مهندسی کامپیوتر ۲۴۰ دقیقه ... ۱۱۵ تست» https://cshub.ir/کنکور-کامپیوتر-چگونه-است/
  per_subject_1405:           # از جدول‌های بودجه‌بندی cshub (ستون 1405) — https://cshub.ir/computer-konkur-sections/
    discrete: 6
    stats: 7
    toc: 5
    dsa_old: 12               # ساختمان داده + طراحی الگوریتم (قدیم)
    ai: 8
    logic: 7

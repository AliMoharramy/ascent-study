# seed/chapter-weights.yaml
# وزن مورد انتظار سؤال هر فصل (Eq) برای موتور Triage (docs/03 §6).
# منبع: جدول‌های «تعداد تست مطرح‌شده از هر فصل» در https://cshub.ir/computer-konkur-sections/
#   (کنکورهای 1397 تا 1405؛ تصویرها 23 آبان 1405 خوانده و با جمع سطر/ستون کنترل شدند). گزارش: docs/research/T-DATA-07-chapter-weights.md
# eq_weight = سهم نرمال‌شده‌ی فصل در کل سؤالات همان درس (جمع eq_weight هر درس ≈ 1). بازه: 1397-1405. eq_weight_recent: فقط 1400-1405.
# raw_q = جمع سؤال‌های نگاشت‌شده به این فصل (اعشار = سؤال چندفصلی که cshub تقسیم کرده یا تقسیم تخمینی من).
# estimated:true = تقسیم یک فصل cshub بین چند فصل پروژه، تخمین من است. ambiguous:true = تطابق سرفصل cshub با subjects.yaml قطعی نیست.
# proxy:true = از درس مشابه در کنکور دیگر (جبر خطی ← «مبانی ماتریس و جبر خطی» کنکور علوم کامپیوتر).
# ⚠ کنکور ۱۴۰۶ نخستین سال ساختار جدید است؛ گذشته فقط برآوردی از آینده است.

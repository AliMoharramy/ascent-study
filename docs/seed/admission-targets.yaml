targets:                           # kind: recommendation (من) — بر پایهٔ 1404/1405 که بالاترین سطح درصدها را داشته‌اند
  kind: recommendation
  operational_net_pct: 40          # هدف عملیاتی سیستم (به‌جای 35) — ≈ رتبهٔ آزاد ~120-150 در 1404/1405
  floor_net_pct: 35                # کف قابل‌قبول (≈ رتبهٔ ~250 در 1404/1405 ← علم‌وصنعت/امیرکبیر در گرایش‌های کم‌رقابت‌تر)
  stretch_net_pct: 45              # کشش (≈ رتبه ~50-70 در 1404/1405 ← شریف/تهران در اغلب گرایش‌ها)
  metric: "weighted net % = (1*english + 2*math + 4*specialized)/7 روی آزمون‌های جامع (آزمایشی 9..13 و Mini-Trialهای جامع)"
  rank_goal_free_quota: "≤ ~200 (ایمن برای هر ۴ دانشگاه در حداقل یک گرایش)؛ ≤ ~100 برای انتخاب آزاد گرایش"
  caveats:
    - "ساختار ۱۴۰۶ جدید است: ضرایب 1/2/4 و یک رتبه؛ توزیع درصدها ممکن است جابه‌جا شود."
    - "آزمون‌های آزمایشی cshub ممکن است سخت‌تر/آسان‌تر از کنکور باشند؛ هدف را با رتبهٔ کاربر در لیدربورد آزمون‌ها هم کالیبره کن."
    - "جبر خطی حذف‌شده: سقف درصد ریاضیات کاربر ≈ 67٪ (اگر سه درس هم‌وزن باشند) → برای 40٪ وزنی باید تخصصی‌ها ≈ 45٪+ باشند."

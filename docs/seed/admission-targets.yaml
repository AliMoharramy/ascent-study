# seed/admission-targets.yaml
# هدف‌های کمّی قبولی (شریف، امیرکبیر، علم‌وصنعت، تهران) — گزارش: docs/research/T-DATA-04-admission-records.md
# kind: claim = ادعای منبع ؛ computed = محاسبهٔ من از دادهٔ خام بانک کارنامه ؛ recommendation = پیشنهاد من
# ⚠ همهٔ درصدها با ساختار قدیم (۴ کد ضریب، ۶ باکس) هستند. «درصد» = «میانگین درصد ضریب» زیرگروه مربوط به گرایش قبولی در کارنامه (درصد خالص با منفی).
# ⚠ نمونه خوداظهار/گزینشی است (بیشتر دانشجویان مشاوره cshub + جمع‌آوری از اینترنت) → سوگیری به سمت رتبه‌های خوب.

source:
  karnameh_bank_url: "https://cshub.ir/konkur-computer-results/"
  ranks_article_url: "https://cshub.ir/رتبه-قبولی-ارشد-کامپیوتر-در-دانشگاه-ها/"
  extracted_jalali: "1405-08-23"
  rows_total: 2518                 # computed: کل ردیف‌های جدول (1400: 271، 1401: 282، 1402: 242، 1403: 529، 1404: 805، 1405: 389)
  rows_free_quota: 2182            # computed: سهمیه 0 (آزاد)
  filter_used: "سهمیه آزاد (0)، روزانه (بدون نوبت دوم/پردیس/مجازی/شبانه)، دانشگاه از متن ستون «قبولی»"
  note_1405: "کارنامه‌های 1405 در بانک هست ولی محل قبولی ندارند (نتایج نهایی هنوز نیامده/ثبت نشده)؛ فقط برای رابطهٔ رتبه↔درصد استفاده شد."


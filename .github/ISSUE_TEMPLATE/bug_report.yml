name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Never paste secrets, connection strings, API keys or personal study data.**
        Security problems: do NOT open an issue — see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead?
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open /today\n2. ...\n3. ..."
    validations: { required: true }
  - type: dropdown
    id: where
    attributes:
      label: How are you running it?
      options: [Vercel + Neon, Docker (self-host), "Local dev (make dev)", Other]
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: "0.1.0 or a commit hash"
  - type: textarea
    id: logs
    attributes:
      label: Logs / error code
      description: "Server logs only contain a short code such as `55P03`. Remove anything private."
      render: text

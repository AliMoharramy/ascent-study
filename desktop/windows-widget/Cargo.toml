[package]
name = "ascent-focus-widget"
version = "0.1.0"
edition = "2021"
build = "build.rs"
publish = false

[dependencies]
slint = { version = "=1.19.0", default-features = false, features = ["std", "compat-1-18", "backend-winit", "renderer-software", "system-tray", "raw-window-handle-06"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "=4.2.0", default-features = false, features = ["v1"] }
raw-window-handle = "0.6"
url = "2"
uuid = { version = "=1.29.0", default-features = false, features = ["v4", "std"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
slint-build = "=1.19.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
